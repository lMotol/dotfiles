name: Test Dotfiles Setup

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux-docker:
    name: Test on Linux Docker
    runs-on: ubuntu-latest

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Linux smoke test
        run: uv run python script/dotfiles.py test

  test-macos:
    name: Test on macOS Runner
    runs-on: macos-latest

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run macOS setup smoke test
        env:
          HOME: ${{ runner.temp }}/dotfiles-home
          WORKSPACE_DIR: ${{ github.workspace }}
        run: uv run python script/test_dotfiles/entrypoint.py

  shellcheck:
    name: ShellCheck Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: .git
