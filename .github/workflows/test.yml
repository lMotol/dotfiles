name: Test Dotfiles Setup

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux-docker:
    name: Test on Linux Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Linux smoke test image
        run: docker build -t dotfiles-linux-test -f test_dotfiles/Dockerfile test_dotfiles

      - name: Run Linux smoke test
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" dotfiles-linux-test

  test-macos:
    name: Test on macOS Runner
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run macOS setup smoke test
        env:
          HOME: ${{ runner.temp }}/dotfiles-home
          WORKSPACE_DIR: ${{ github.workspace }}
        run: bash test_dotfiles/entrypoint.sh

  shellcheck:
    name: ShellCheck Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: test_dotfiles .git
