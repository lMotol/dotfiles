[tool.poetry]
name = "dotfiles"
version = "0.1.0"
description = "Manage and bootstrap dotfiles"
authors = ["motomasa <motomasa@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10"
typer = "^0.9"
rich = "^13.0"
pydantic = "^1.10"
uv = "*" # Astral's `uv` tool for dependency/environment management

[tool.poetry.scripts]
dotfiles = "dotfiles.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
