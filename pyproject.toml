[project]
name = "dotfiles"
version = "0.1.0"
description = "Manage and bootstrap dotfiles"
authors = [{ name = "motomasa", email = "motomasa@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9,<1",
    "rich>=13,<14",
    "pydantic>=1.10,<2",
]

[project.scripts]
dotfiles = "cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["install"]
py-modules = ["cli", "context", "installers", "setup_flow", "util"]
